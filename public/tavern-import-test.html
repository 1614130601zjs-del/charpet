<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>CharPet · 酒馆角色卡导入测试</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f7f4ef;color:#302b28;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.wrap{max-width:1000px;margin:auto;padding:28px 18px 60px}.head{display:flex;justify-content:space-between;gap:16px;align-items:flex-start}.eyebrow{font-size:11px;letter-spacing:.14em;color:#9a9188;font-weight:800}.head h1{margin:7px 0;font-size:30px}.head p{color:#766e68;margin:0}.badge{padding:8px 11px;border:1px solid #e2d9d1;background:#fff;border-radius:999px;font-size:12px}.drop{margin-top:20px;border:2px dashed #cfc3b9;background:#fffdf9;border-radius:24px;padding:42px 24px;text-align:center;cursor:pointer}.drop.over{border-color:#6f625a;background:#f3ece5}.drop strong{display:block;font-size:19px;margin-bottom:8px}.drop span{font-size:13px;color:#817870}.hidden{display:none}.error,.success{margin-top:14px;padding:14px;border-radius:14px;font-size:13px;line-height:1.6}.error{background:#fff0ed;color:#9a4035}.success{background:#edf7ef;color:#3f7547}.result{margin-top:20px;display:grid;grid-template-columns:280px 1fr;gap:16px}.card,.panel{background:#fffdf9;border:1px solid #e3dbd3;border-radius:22px;padding:18px}.cover{width:100%;aspect-ratio:3/4;border-radius:16px;object-fit:cover;background:#eee}.meta{display:flex;gap:7px;flex-wrap:wrap;margin-top:12px}.chip{padding:6px 9px;border-radius:999px;background:#f0e9e3;font-size:11px;color:#716861}.field{margin-bottom:17px}.field b{display:block;font-size:12px;color:#857a72;margin-bottom:7px}.field pre{white-space:pre-wrap;word-break:break-word;margin:0;line-height:1.65;font-size:13px;background:#f5f0eb;padding:12px;border-radius:13px;max-height:500px;overflow:auto}.worldbook{margin-top:22px;padding-top:18px;border-top:1px solid #e8e0d8}.worldbook-head{display:flex;align-items:center;justify-content:space-between;gap:14px}.worldbook-title{font-size:16px;font-weight:800}.worldbook-control{display:flex;align-items:center;gap:9px;color:#665d57;font-size:12px;font-weight:700;cursor:pointer;user-select:none}.toggle{appearance:none;width:46px;height:26px;border-radius:999px;background:#c8beb6;position:relative;cursor:pointer;transition:.2s;border:0}.toggle:before{content:"";position:absolute;width:20px;height:20px;left:3px;top:3px;border-radius:50%;background:#fff;box-shadow:0 1px 3px #0002;transition:.2s}.toggle:checked{background:#756960}.toggle:checked:before{transform:translateX(20px)}.worldbook-sub{margin:8px 0 12px;color:#857a72;font-size:12px;line-height:1.5}.period{border:1px solid #e4ddd5;border-radius:15px;padding:13px;margin-top:9px;background:#fff}.period-title{font-weight:750;font-size:13px}.period-text{margin-top:7px;white-space:pre-wrap;word-break:break-word;font-size:13px;line-height:1.6}.empty,.muted{color:#8a817a;font-size:13px}@media(max-width:760px){.result{grid-template-columns:1fr}.head{display:block}.badge{display:inline-block;margin-top:12px}}
</style>
</head>
<body><main class="wrap">
<header class="head"><div><span class="eyebrow">CHARPET · IMPORT LAB</span><h1>酒馆角色卡导入测试</h1><p>把 SillyTavern V2 / V3 PNG 丢进来，看看 CharPet 能不能完整解析。</p></div><span class="badge">本地解析 · 不上传图片</span></header>
<label class="drop" id="drop"><strong>🪪 拖一张酒馆 PNG 角色卡到这里</strong><span>也可以点击选择文件 · 支持标准 chara / ccv3 PNG</span><input id="file" class="hidden" type="file" accept="image/png,.png"></label>
<div id="error"></div><div id="status"></div><section id="result"></section>
</main>
<script>
const SIG=[137,80,78,71,13,10,26,10],MAX=20*1024*1024,$=id=>document.getElementById(id);
function ascii(b){return new TextDecoder('latin1').decode(b)}function text(b){return new TextDecoder('utf-8').decode(b)}function u32(b,o){return new DataView(b.buffer,b.byteOffset+o,4).getUint32(0)}
function b64(v){const s=atob(v.replace(/\s+/g,'')),b=new Uint8Array(s.length);for(let i=0;i<s.length;i++)b[i]=s.charCodeAt(i);return b}
function payload(v){try{const x=JSON.parse(text(b64(v)));return x&&typeof x==='object'?x:null}catch{return null}}
function normalize(p,spec){const d=p.data&&typeof p.data==='object'?p.data:p;return{format:'png',spec,name:typeof d.name==='string'?d.name:'',description:typeof d.description==='string'?d.description:'',personality:typeof d.personality==='string'?d.personality:'',scenario:typeof d.scenario==='string'?d.scenario:'',firstMessage:typeof d.first_mes==='string'?d.first_mes:'',messageExamples:typeof d.mes_example==='string'?d.mes_example:'',tags:Array.isArray(d.tags)?d.tags.filter(x=>typeof x==='string'):[],characterBook:d.character_book&&typeof d.character_book==='object'?d.character_book:null}}
function parse(buf){const b=new Uint8Array(buf);if(b.length>MAX)throw Error('角色卡超过 20MB');if(b.length<8||!SIG.every((x,i)=>b[i]===x))throw Error('这不是 PNG 文件');let o=8,v3=null,v2=null,v1=null;while(o+12<=b.length){const len=u32(b,o),type=ascii(b.subarray(o+4,o+8)),ds=o+8,de=ds+len;if(de+4>b.length)break;const d=b.subarray(ds,de);if(type==='tEXt'){const z=d.indexOf(0);if(z>=0){const k=ascii(d.subarray(0,z)),v=ascii(d.subarray(z+1));if(k==='ccv3')v3=payload(v);if(k==='chara'){const q=payload(v);if(q){if(q.data&&typeof q.data==='object')v2=q;else v1=q}}}}o=de+4;if(type==='IEND')break}if(v3)return normalize(v3,'v3');if(v2)return normalize(v2,'v2');if(v1)return normalize(v1,'v1');throw Error('没有找到 chara / ccv3 角色卡数据，这张 PNG 可能只是普通图片或分享图')}
function esc(s){return String(s??'').replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;','\\':'&#39;'}[c]))}
function profileText(c){const a=[];if(c.description)a.push('【角色描述】\n'+c.description);if(c.personality)a.push('【性格】\n'+c.personality);if(c.scenario)a.push('【场景】\n'+c.scenario);if(c.firstMessage)a.push('【开场白】\n'+c.firstMessage);if(c.messageExamples)a.push('【示例对话】\n'+c.messageExamples);return a.join('\n\n')||'（空）'}
function entryText(e){return JSON.stringify(e||{}).toLowerCase()}
function isPeriodPersonality(e){const s=entryText(e);const time=/(童年|少年|青年|成年|晚年|幼年|小时候|年幼|长大后|过去|现在|未来|初期|后期|早期|中期|时期|阶段|日间|白天|夜晚|晚上|深夜|清晨|早晨|day|night|morning|childhood|teen|adult|future|past|phase|period)/i.test(s);const personality=/(性格|人格|脾气|态度|行为|举止|习惯|情绪|心理|内心|性情|特点|特征|personality|temper|behavior|mood|trait|attitude|habit|emotion)/i.test(s);return time&&personality}
function periodTitle(e,i){return String(e.comment||e.name||e.key||'时间段性格 '+(i+1))}
function periodContent(e){const keys=['content','entry','text','description','comment','memo','value'];for(const k of keys)if(typeof e?.[k]==='string'&&e[k].trim())return e[k].trim();return ''}
function renderPeriods(wb){const es=Array.isArray(wb?.entries)?wb.entries:[];const selected=es.filter(isPeriodPersonality).map(periodContent).filter(Boolean);if(!selected.length)return '<div class="muted">没有自动识别到明显的“时间段 × 性格”内容。其他世界书内容不在这里展开。</div>';return es.filter(isPeriodPersonality).map((e,i)=>{const body=periodContent(e);if(!body)return '';return `<article class="period"><div class="period-title">${esc(periodTitle(e,i))}</div><div class="period-text">${esc(body)}</div></article>`}).join('')}
function field(t,v){return `<div class="field"><b>${esc(t)}</b><pre>${esc(v||'（空）')}</pre></div>`}
function render(file,c){const r=new FileReader();r.onload=()=>{$('result').innerHTML=`<div class="result"><aside class="card"><img class="cover" src="${r.result}" alt="角色卡"><div class="meta"><span class="chip">${esc(c.spec.toUpperCase())}</span><span class="chip">${c.firstMessage?'含 first_mes':'无 first_mes'}</span></div><div style="margin-top:14px;font-size:18px;font-weight:800">${esc(c.name||file.name)}</div><div style="margin-top:6px;color:#817870;font-size:12px">这是实际解析结果，不是只看文件名。</div></aside><div class="panel">${field('角色名',c.name)}${field('角色资料',profileText(c))}${field('原始标签 / tags',c.tags.join(' · ')||'（原卡没有标签）')}<div class="worldbook"><div class="worldbook-head"><div class="worldbook-title">角色关联信息</div><label class="worldbook-control"><span>显示时间段性格</span><input id="periodToggle" class="toggle" type="checkbox" checked aria-label="显示时间段性格"></label></div><div class="worldbook-sub">不展示状态栏、优先级、概率、关键词等世界书结构字段。这里只显示和角色本身关系比较大的内容。</div><div id="periods">${c.characterBook?renderPeriods(c.characterBook):'<div class="empty">没有角色关联世界书。</div>'}</div></div></div></div>`;const t=$('periodToggle');if(t)t.addEventListener('change',e=>{$('periods').style.display=e.target.checked?'':'none'})};r.readAsDataURL(file)}
async function handle(f){$('error').innerHTML='';$('status').innerHTML='';$('result').innerHTML='';if(!f)return;try{$('status').innerHTML='<div class="success">正在本地解析：'+esc(f.name)+'</div>';const c=parse(await f.arrayBuffer());render(f,c);$('status').innerHTML='<div class="success">✓ 解析成功：'+esc(c.name||f.name)+' · '+c.spec.toUpperCase()+'</div>'}catch(e){$('error').innerHTML='<div class="error">解析失败：'+esc(e.message||e)+'</div>'}}
$('file').addEventListener('change',e=>handle(e.target.files?.[0]));$('drop').addEventListener('dragover',e=>{e.preventDefault();$('drop').classList.add('over')});$('drop').addEventListener('dragleave',()=>$('drop').classList.remove('over'));$('drop').addEventListener('drop',e=>{e.preventDefault();$('drop').classList.remove('over');handle(e.dataTransfer.files?.[0])});
</script></body></html>
