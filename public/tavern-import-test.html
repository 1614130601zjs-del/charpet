<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CharPet · 酒馆角色卡导入测试</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f7f4ef;color:#302b28;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.wrap{width:min(900px,calc(100% - 28px));margin:auto;padding:32px 0 60px}.head{margin-bottom:20px}.eyebrow{font-size:11px;letter-spacing:.14em;color:#9a9188;font-weight:800}.head h1{margin:8px 0 6px;font-size:clamp(28px,6vw,44px);line-height:1.12}.head p{margin:0;color:#766e68;line-height:1.7}.drop{display:block;border:2px dashed #cfc3b9;background:#fffdf9;border-radius:22px;padding:30px 18px;text-align:center;cursor:pointer}.drop strong{display:block;font-size:18px;margin-bottom:8px}.drop span{font-size:13px;color:#817870}.hidden{display:none}.notice{margin-top:14px;padding:13px 15px;border-radius:14px;font-size:13px;line-height:1.6}.success{background:#edf7ef;color:#3f7547}.error{background:#fff0ed;color:#9a4035}.result{margin-top:18px;display:grid;grid-template-columns:210px minmax(0,1fr);gap:16px}.card,.panel{min-width:0;background:#fffdf9;border:1px solid #e3dbd3;border-radius:22px;padding:16px}.cover{display:block;width:100%;aspect-ratio:3/4;object-fit:cover;border-radius:15px;background:#eee}.meta{display:flex;gap:6px;flex-wrap:wrap;margin-top:11px}.chip{padding:6px 9px;border-radius:999px;background:#f0e9e3;font-size:11px;color:#716861}.name{margin-top:13px;font-size:18px;font-weight:800}.muted{margin-top:5px;color:#817870;font-size:12px;line-height:1.5}.field{margin-bottom:16px}.field>b{display:block;font-size:12px;color:#857a72;margin-bottom:7px}.field pre{margin:0;max-height:300px;overflow:auto;white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.65;font-size:13px;background:#f5f0eb;padding:12px;border-radius:13px}.worldbook{margin-top:22px;padding-top:18px;border-top:1px solid #e8e0d8}.worldbook-head{display:flex;align-items:center;justify-content:space-between;gap:14px}.worldbook-title{font-size:19px;font-weight:800}.global-control{display:flex;align-items:center;gap:9px;font-size:12px;font-weight:700;color:#665d57;white-space:nowrap}.toggle,.timeline-switch,.entry-switch{appearance:none;cursor:pointer}.toggle,.timeline-switch{border:0;border-radius:999px;background:#c8beb6;position:relative}.toggle{width:44px;height:25px}.toggle:before,.timeline-switch:before{content:"";position:absolute;border-radius:50%;background:#fff;transition:.2s;box-shadow:0 1px 3px #0002}.toggle:before{width:19px;height:19px;left:3px;top:3px}.toggle:checked,.timeline-switch:checked{background:#756960}.toggle:checked:before,.timeline-switch:checked:before{transform:translateX(19px)}.worldbook-sub{margin:8px 0 14px;color:#857a72;font-size:12px;line-height:1.7}.timeline{border:1px solid #e2dad2;border-radius:16px;overflow:hidden;margin-top:11px;background:#fff}.timeline-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:13px 14px;background:#faf7f3}.timeline-title{min-width:0;display:flex;align-items:center;gap:10px}.timeline-title b{font-size:15px}.timeline-count{font-size:11px;color:#8a817a;margin-top:2px}.timeline-switch{width:44px;height:25px;flex:none}.timeline-switch:before{width:19px;height:19px;left:3px;top:3px}.timeline-switch:indeterminate{background:#a79b92}.timeline-switch:indeterminate:before{transform:translateX(9px)}.timeline-state{font-size:11px;color:#817870;min-width:54px;text-align:right}.entry{display:grid;grid-template-columns:20px minmax(0,1fr);gap:10px;padding:12px 14px;border-top:1px solid #eee7df}.entry-switch{margin-top:3px}.entry-title{font-size:12px;font-weight:750;color:#5f554e;overflow-wrap:anywhere}.entry-text{margin-top:4px;font-size:13px;line-height:1.6;white-space:pre-wrap;overflow-wrap:anywhere}.empty{padding:16px;color:#8a817a;font-size:13px;line-height:1.7}@media(max-width:680px){.result{grid-template-columns:1fr}.card{display:grid;grid-template-columns:100px minmax(0,1fr);gap:12px}.cover{grid-row:span 3}.meta{margin-top:0}.name{margin-top:4px}}@media(max-width:420px){.wrap{width:calc(100% - 20px);padding-top:22px}.card{grid-template-columns:82px minmax(0,1fr);padding:13px}.timeline-state{display:none}.worldbook-head{align-items:flex-start}.global-control{font-size:11px}}
</style>
</head>
<body>
<main class="wrap">
<header class="head"><span class="eyebrow">CHARPET · IMPORT LAB</span><h1>酒馆角色卡导入测试</h1><p>解析 SillyTavern V2 / V3 PNG，并从世界书中整理角色本人的时间段性格与性格影响信息。</p></header>
<label class="drop" id="drop"><strong>🪪 拖一张酒馆 PNG 角色卡到这里</strong><span>也可以点击选择文件 · 支持标准 chara / ccv3 PNG</span><input id="file" class="hidden" type="file" accept="image/png,.png"></label>
<div id="status"></div><div id="error"></div><section id="result"></section>
</main>
<script>
const SIG=[137,80,78,71,13,10,26,10],MAX=20*1024*1024,$=id=>document.getElementById(id);
const ascii=b=>new TextDecoder('latin1').decode(b),text=b=>new TextDecoder('utf-8').decode(b),u32=(b,o)=>new DataView(b.buffer,b.byteOffset+o,4).getUint32(0);
function b64(v){const s=atob(v.replace(/\s+/g,'')),b=new Uint8Array(s.length);for(let i=0;i<s.length;i++)b[i]=s.charCodeAt(i);return b}
function payload(v){try{const x=JSON.parse(text(b64(v)));return x&&typeof x==='object'?x:null}catch{return null}}
function normalize(p,spec){const d=p.data&&typeof p.data==='object'?p.data:p;return{format:'png',spec,name:typeof d.name==='string'?d.name:'',description:typeof d.description==='string'?d.description:'',personality:typeof d.personality==='string'?d.personality:'',scenario:typeof d.scenario==='string'?d.scenario:'',firstMessage:typeof d.first_mes==='string'?d.first_mes:'',messageExamples:typeof d.mes_example==='string'?d.mes_example:'',tags:Array.isArray(d.tags)?d.tags.filter(x=>typeof x==='string'):[],characterBook:d.character_book&&typeof d.character_book==='object'?d.character_book:null}}
function parse(buf){const b=new Uint8Array(buf);if(b.length>MAX)throw Error('角色卡超过 20MB');if(b.length<8||!SIG.every((x,i)=>b[i]===x))throw Error('这不是 PNG 文件');let o=8,v3=null,v2=null,v1=null;while(o+12<=b.length){const len=u32(b,o),type=ascii(b.subarray(o+4,o+8)),ds=o+8,de=ds+len;if(de+4>b.length)break;const d=b.subarray(ds,de);if(type==='tEXt'){const z=d.indexOf(0);if(z>=0){const k=ascii(d.subarray(0,z)),v=ascii(d.subarray(z+1));if(k==='ccv3')v3=payload(v);if(k==='chara'){const q=payload(v);if(q){if(q.data&&typeof q.data==='object')v2=q;else v1=q}}}}o=de+4;if(type==='IEND')break}if(v3)return normalize(v3,'v3');if(v2)return normalize(v2,'v2');if(v1)return normalize(v1,'v1');throw Error('没有找到 chara / ccv3 角色卡数据，这张 PNG 可能只是普通图片或分享图')}
function esc(s){return String(s??'').replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;','\\':'&#39;'}[c]||c))}
function field(t,v){return `<div class="field"><b>${esc(t)}</b><pre>${esc(v||'（空）')}</pre></div>`}
function profileText(c){const a=[];if(c.description)a.push('【角色描述】\n'+c.description);if(c.personality)a.push('【性格】\n'+c.personality);if(c.scenario)a.push('【场景】\n'+c.scenario);if(c.firstMessage)a.push('【开场白】\n'+c.firstMessage);if(c.messageExamples)a.push('【示例对话】\n'+c.messageExamples);return a.join('\n\n')||'（空）'}
function titleOf(e){return[e?.comment,e?.name,e?.key].find(v=>typeof v==='string'&&v.trim())?.trim()||''}
function timeMarkFromTitle(e){const title=titleOf(e);const matches=[...title.matchAll(/[（(]\s*([^（）()\n]{1,24}?)\s*[）)]/g)];for(const m of matches){const raw=m[1].trim().replace(/\s+/g,'');if(/^(幼儿园|小学|初中|高中|大学|研究生|职场|工作|退休|童年|少年|青年|成年|老年)(时期|阶段|时代|线)?$/.test(raw))return raw.replace(/(时期|阶段|时代|线)$/,'');if(/^\d{1,3}(岁|周岁)$/.test(raw))return raw;if(/^\d{1,3}$/.test(raw)){const n=Number(raw);if(n>=0&&n<=120)return raw+'岁'}}return null}
function content(e){for(const k of ['content','entry','text','description','memo','value'])if(typeof e?.[k]==='string'&&e[k].trim())return e[k].trim();return''}
function isExcluded(e){const title=titleOf(e),body=content(e),all=title+'\n'+body;return /(npc|npcs|住址|地址|地点|房间|场所|状态栏|状态值|status|输出格式|格式要求|输出规则|system|系统提示|世界观设定|背景设定|装备|物品栏|inventory|关系网|其他角色资料|路人资料)/i.test(all)}
function groupEntries(wb){const es=Array.isArray(wb?.entries)?wb.entries:[],groups=new Map();es.forEach((e,i)=>{e.__charpetIndex=i;const mark=timeMarkFromTitle(e);if(!mark||isExcluded(e))return;if(!groups.has(mark))groups.set(mark,[]);groups.get(mark).push(e)});return groups}
function renderGroups(wb){const groups=groupEntries(wb);if(!groups.size)return'<div class="empty">暂时没有识别到时间段。<br>这里只看<strong>词条标题里的（高中）/（18岁）/（大学）</strong>这类明确时间标记；同时过滤 NPC、住址、状态栏、输出格式等非角色内容。<br>注意：不会再要求正文必须出现“性格”两个字，所以“高中经历”这类会影响性格的词条也能保留下来。</div>';return[...groups.entries()].map(([timeline,es])=>{const all=es.every(e=>e.enabled!==false),none=es.every(e=>e.enabled===false),state=all?'全部开启':none?'全部关闭':'部分开启';return`<section class="timeline"><div class="timeline-head"><label class="timeline-title"><input class="timeline-switch" data-timeline="${esc(timeline)}" type="checkbox" ${all?'checked':''} aria-label="${esc(timeline)} 总开关"><div><b>${esc(timeline)}</b><div class="timeline-count">${es.length} 条相关词条</div></div></label><span class="timeline-state">${state}</span></div>${es.map((e,i)=>`<article class="entry"><input class="entry-switch" type="checkbox" data-entry="${e.__charpetIndex}" ${e.enabled!==false?'checked':''} aria-label="${esc(timeline)} 第 ${i+1} 条"><div><div class="entry-title">${esc(titleOf(e)||'相关词条 '+(i+1))}</div><div class="entry-text">${esc(content(e)||'（空）')}</div></div></article>`).join('')}</section>`}).join('')}
function render(file,c){const reader=new FileReader();reader.onload=()=>{$('result').innerHTML=`<div class="result"><aside class="card"><img class="cover" src="${reader.result}" alt="角色卡"><div><div class="meta"><span class="chip">${esc(c.spec.toUpperCase())}</span><span class="chip">${c.firstMessage?'含 first_mes':'无 first_mes'}</span><span class="chip">${c.characterBook?((c.characterBook.entries||[]).length+' 条世界书'):'无世界书'}</span></div><div class="name">${esc(c.name||file.name)}</div><div class="muted">已解析角色卡本身的数据。</div></div></aside><div class="panel">${field('角色名',c.name)}${field('角色资料',profileText(c))}${field('原始标签 / tags',c.tags.join(' · ')||'（原卡没有标签）')}<section class="worldbook"><div class="worldbook-head"><div class="worldbook-title">角色关联信息</div><label class="global-control"><span>显示时间段性格</span><input id="periodToggle" class="toggle" type="checkbox" checked></label></div><p class="worldbook-sub">时间线只从<strong>词条标题括号里的时间标记</strong>产生；每条时间线有自己的总开关，组内词条也可以单独开关。</p><div id="periods">${renderGroups(c.characterBook)}</div></section></div></div>`;bindGroups(c);const t=$('periodToggle');if(t)t.onchange=e=>{$('periods').style.display=e.target.checked?'':'none'}};reader.readAsDataURL(file)}
function bindGroups(c){const groups=groupEntries(c.characterBook);document.querySelectorAll('.timeline-switch').forEach(sw=>{const arr=groups.get(sw.dataset.timeline)||[];sw.indeterminate=arr.some(e=>e.enabled!==false)&&arr.some(e=>e.enabled===false);sw.onchange=()=>{arr.forEach(e=>e.enabled=sw.checked);renderGroupsOnly(c)}});document.querySelectorAll('.entry-switch').forEach(sw=>{const e=(c.characterBook?.entries||[])[Number(sw.dataset.entry)];if(e)sw.onchange=ev=>{e.enabled=ev.target.checked;renderGroupsOnly(c)}})}
function renderGroupsOnly(c){$('periods').innerHTML=renderGroups(c.characterBook);bindGroups(c)}
async function handle(f){$('status').innerHTML='';$('error').innerHTML='';$('result').innerHTML='';if(!f)return;try{$('status').innerHTML='<div class="notice success">正在本地解析：'+esc(f.name)+'</div>';const c=parse(await f.arrayBuffer());render(f,c);$('status').innerHTML='<div class="notice success">✓ 解析成功：'+esc(c.name||f.name)+' · '+c.spec.toUpperCase()+'</div>'}catch(e){$('error').innerHTML='<div class="notice error">解析失败：'+esc(e.message||e)+'</div>'}}
$('file').addEventListener('change',e=>handle(e.target.files?.[0]));$('drop').addEventListener('dragover',e=>e.preventDefault());$('drop').addEventListener('drop',e=>{e.preventDefault();handle(e.dataTransfer.files?.[0])});
</script>
</body>
</html>
