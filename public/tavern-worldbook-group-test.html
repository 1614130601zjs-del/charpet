<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CharPet · 世界书时间线分组</title>
<style>
body{font-family:system-ui,-apple-system,sans-serif;margin:0;background:#f6f3ef;color:#292522}main{max-width:900px;margin:32px auto;padding:0 18px}h1{font-size:24px}.hint{color:#756d65;line-height:1.7}.book{background:#fff;border:1px solid #e5ded6;border-radius:18px;padding:18px;margin:16px 0}.book h2{margin:0 0 14px}.group{border:1px solid #eee6de;border-radius:14px;margin:12px 0;overflow:hidden}.groupHead{display:flex;align-items:center;gap:10px;padding:12px 14px;background:#faf7f3}.groupHead label{display:flex;align-items:center;gap:10px;cursor:pointer;flex:1}.groupHead b{font-size:16px}.groupState{font-size:12px;color:#756d65}.switch{cursor:pointer;width:18px;height:18px}.entry{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-top:1px solid #eee6de}.entryText{flex:1;white-space:pre-wrap;line-height:1.6}.actions{display:flex;gap:6px}.btn{border:1px solid #ddd3c9;background:#fff;border-radius:9px;padding:7px 10px;cursor:pointer}.primary{background:#292522;color:white}.add{margin-top:10px;width:100%}.analysis{font-size:12px;color:#8b8178;margin:0 0 14px;padding:9px 11px;background:#faf7f3;border-radius:10px}dialog{border:0;border-radius:16px;padding:18px;max-width:520px;width:calc(100% - 40px)}textarea{width:100%;box-sizing:border-box;padding:10px;border:1px solid #ddd3c9;border-radius:10px;margin:8px 0 12px}dialog::backdrop{background:#0005}
</style></head>
<body><main><h1>角色关联世界书</h1><p class="hint">导入世界书后，先分析每条词条对应的时间段，再把相同时段的词条自动归到同一条时间线。<b>时间线本身就是总开关</b>；下面的词条仍然可以单独开关。</p><div id="app"></div>
<dialog id="editDialog"><form method="dialog"><h3 id="dialogTitle">编辑条目</h3><p id="dialogTimeline" class="analysis"></p><label>内容</label><textarea id="editText" rows="6" placeholder="只填写角色真正需要知道的内容"></textarea><div style="display:flex;gap:8px;justify-content:flex-end"><button class="btn" value="cancel">取消</button><button class="btn primary" id="saveBtn" value="default">保存</button></div></form></dialog>
<script>
const rawEntries=[
{id:1,text:'高中时期性格偏克制，面对熟悉的人会逐渐放松。',enabled:true},
{id:2,text:'高中时期与用户的关系：会偷偷关注对方，但不主动承认。',enabled:true},
{id:3,text:'大学时期开始更主动表达自己的想法。',enabled:false},
{id:4,text:'大学时期参加社团，和用户一起经历了很多事情。',enabled:true},
{id:5,text:'现在更愿意直接表达关心，也会主动黏人。',enabled:true},
{id:6,text:'现在和用户相处时会自然地分享日常。',enabled:true}
];
const books=[{name:'角色世界书 · 宋知杳',entries:rawEntries}];
let editing=null;
const esc=s=>String(s).replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\\"':'&quot;'}[c]||c));

// 测试页用关键词模拟“导入后分析”。正式接入 AI 后，这里替换成 AI 的结构化分析结果即可。
function analyzeTimeline(text){
 const t=String(text);
 if(/高中|初中|小学|童年/.test(t))return '高中线';
 if(/大学|大一|大二|大三|大四|校园|社团/.test(t))return '大学线';
 if(/现在|如今|目前|当下/.test(t))return '现在';
 return '未识别时间线';
}
function timelineEntries(book){
 const groups=new Map();
 book.entries.forEach(e=>{e.timeline=e.timeline||analyzeTimeline(e.text);if(!groups.has(e.timeline))groups.set(e.timeline,[]);groups.get(e.timeline).push(e)});
 return groups;
}
function render(){
 const app=document.querySelector('#app');app.innerHTML='';
 books.forEach(book=>{
  const el=document.createElement('section');el.className='book';el.innerHTML='<h2>'+esc(book.name)+'</h2><p class="analysis">已分析 '+book.entries.length+' 条词条，并按时间段自动归类</p>';
  timelineEntries(book).forEach((arr,g)=>{
   const all=arr.length>0&&arr.every(e=>e.enabled),none=arr.length>0&&arr.every(e=>!e.enabled),partial=!all&&!none;
   const box=document.createElement('div');box.className='group';
   box.innerHTML='<div class="groupHead"><label><input class="switch groupSwitch" type="checkbox" '+(all?'checked':'')+'><b>'+esc(g)+'</b></label><span class="groupState">'+(all?'全部开启':none?'全部关闭':'部分开启')+'</span></div>';
   const sw=box.querySelector('.groupSwitch');sw.indeterminate=partial;
   sw.onchange=()=>{const target=sw.checked;arr.forEach(e=>e.enabled=target);render()};
   arr.forEach(e=>{
    const row=document.createElement('div');row.className='entry';
    row.innerHTML='<input class="switch" type="checkbox" '+(e.enabled?'checked':'')+'><div class="entryText">'+esc(e.text)+'</div><div class="actions"><button class="btn edit">编辑</button><button class="btn del">删除</button></div>';
    row.querySelector('input').onchange=ev=>{e.enabled=ev.target.checked;render()};
    row.querySelector('.edit').onclick=()=>openEdit(e,book);
    row.querySelector('.del').onclick=()=>{if(confirm('删除这条世界书内容？')){book.entries=book.entries.filter(x=>x.id!==e.id);render()}};
    box.appendChild(row);
   });
   const add=document.createElement('button');add.className='btn add';add.textContent='＋ 增加世界书条目';add.onclick=()=>openEdit(null,book);box.appendChild(add);el.appendChild(box);
  });
  app.appendChild(el);
 });
}
function openEdit(entry,book){
 editing={entry,book};
 document.querySelector('#dialogTitle').textContent=entry?'编辑世界书条目':'增加世界书条目';
 document.querySelector('#editTimeline').textContent='';
 document.querySelector('#dialogTimeline').textContent=entry?'自动分析时间段：'+(entry.timeline||analyzeTimeline(entry.text)):'保存后将自动分析对应时间段';
 document.querySelector('#editText').value=entry?.text||'';
 document.querySelector('#editDialog').showModal();
}
document.querySelector('#saveBtn').onclick=e=>{
 e.preventDefault();const t=document.querySelector('#editText').value.trim();if(!t)return;
 if(editing.entry){editing.entry.text=t;editing.entry.timeline=analyzeTimeline(t)}else editing.book.entries.push({id:Date.now(),text:t,timeline:analyzeTimeline(t),enabled:true});
 document.querySelector('#editDialog').close();render();
};
render();
</script></main></body></html>
