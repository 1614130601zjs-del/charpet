<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CharPet · 世界书时间线分组</title>
<style>body{font-family:system-ui,-apple-system,sans-serif;margin:0;background:#f6f3ef;color:#292522}main{max-width:900px;margin:32px auto;padding:0 18px}h1{font-size:24px}.hint{color:#756d65}.book{background:#fff;border:1px solid #e5ded6;border-radius:18px;padding:18px;margin:16px 0}.book h2{margin:0 0 14px}.group{border:1px solid #eee6de;border-radius:14px;margin:12px 0;overflow:hidden}.groupHead{display:flex;align-items:center;gap:10px;padding:12px 14px;background:#faf7f3}.groupHead button{margin-left:auto}.groupState{font-size:12px;color:#756d65}.entry{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-top:1px solid #eee6de}.entryText{flex:1;white-space:pre-wrap}.actions{display:flex;gap:6px}.btn{border:1px solid #ddd3c9;background:#fff;border-radius:9px;padding:7px 10px;cursor:pointer}.primary{background:#292522;color:white}.switch{cursor:pointer;width:18px;height:18px}.add{margin-top:10px;width:100%}dialog{border:0;border-radius:16px;padding:18px;max-width:520px;width:calc(100% - 40px)}textarea,input[type=text]{width:100%;box-sizing:border-box;padding:10px;border:1px solid #ddd3c9;border-radius:10px;margin:8px 0 12px}dialog::backdrop{background:#0005}</style></head>
<body><main><h1>角色关联世界书</h1><p class="hint">每本世界书独立。相同时段自动组成一条“时间线”，时间线可以一键全部开启/关闭；其中每条内容也能单独开关、编辑、删除。</p><div id="app"></div>
<dialog id="editDialog"><form method="dialog"><h3 id="dialogTitle">编辑条目</h3><label>时间线</label><input id="editGroup" type="text" placeholder="例如：高中线"><label>内容</label><textarea id="editText" rows="6" placeholder="只填写角色真正需要知道的内容"></textarea><div style="display:flex;gap:8px;justify-content:flex-end"><button class="btn" value="cancel">取消</button><button class="btn primary" id="saveBtn" value="default">保存</button></div></form></dialog>
<script>
const books=[{name:'角色世界书 · 宋知杳',entries:[{id:1,group:'高中线',text:'高中时期性格偏克制，面对熟悉的人会逐渐放松。',enabled:true},{id:2,group:'高中线',text:'高中时期与用户的关系：会偷偷关注对方，但不主动承认。',enabled:true},{id:3,group:'大学线',text:'大学时期开始更主动表达自己的想法。',enabled:false},{id:4,group:'现在',text:'现在更愿意直接表达关心，也会主动黏人。',enabled:true}]}];
let editing=null;
const esc=s=>String(s).replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\\"':'&quot;'}[c]||c));
function render(){const app=document.querySelector('#app');app.innerHTML='';books.forEach(book=>{const el=document.createElement('section');el.className='book';el.innerHTML='<h2>'+esc(book.name)+'</h2>';const groups=[...new Set(book.entries.map(e=>e.group||'未分组'))];groups.forEach(g=>{const arr=book.entries.filter(e=>(e.group||'未分组')===g);const all=arr.length>0&&arr.every(e=>e.enabled),none=arr.length>0&&arr.every(e=>!e.enabled);const box=document.createElement('div');box.className='group';box.innerHTML='<div class="groupHead"><input class="switch groupSwitch" type="checkbox" '+(all?'checked':'')+'><b>'+esc(g)+'</b><span class="groupState">'+(all?'整条时间线已开启':none?'整条时间线已关闭':'时间线部分开启')+'</span><button class="btn groupToggle">'+(all?'一键关闭':'一键开启')+'</button></div>';const head=box.querySelector('.groupHead');const sw=head.querySelector('.groupSwitch');sw.indeterminate=!all&&!none;const toggle=()=>{const target=!all;arr.forEach(e=>e.enabled=target);render()};sw.onchange=toggle;head.querySelector('.groupToggle').onclick=toggle;arr.forEach(e=>{const row=document.createElement('div');row.className='entry';row.innerHTML='<input class="switch" type="checkbox" '+(e.enabled?'checked':'')+'><div class="entryText">'+esc(e.text)+'</div><div class="actions"><button class="btn edit">编辑</button><button class="btn del">删除</button></div>';row.querySelector('input').onchange=ev=>{e.enabled=ev.target.checked;render()};row.querySelector('.edit').onclick=()=>openEdit(e,book);row.querySelector('.del').onclick=()=>{if(confirm('删除这条世界书内容？')){book.entries=book.entries.filter(x=>x.id!==e.id);render()}};box.appendChild(row)});const add=document.createElement('button');add.className='btn add';add.textContent='＋ 增加时间段性格';add.onclick=()=>openEdit(null,book);box.appendChild(add);el.appendChild(box)});app.appendChild(el)})}
function openEdit(entry,book){editing={entry,book};document.querySelector('#dialogTitle').textContent=entry?'编辑世界书条目':'增加时间段性格';document.querySelector('#editGroup').value=entry?.group||'';document.querySelector('#editText').value=entry?.text||'';document.querySelector('#editDialog').showModal()}
document.querySelector('#saveBtn').onclick=e=>{e.preventDefault();const g=document.querySelector('#editGroup').value.trim()||'未分组',t=document.querySelector('#editText').value.trim();if(!t)return;if(editing.entry){editing.entry.group=g;editing.entry.text=t}else editing.book.entries.push({id:Date.now(),group:g,text:t,enabled:true});document.querySelector('#editDialog').close();render()};render();
</script></main></body></html>
