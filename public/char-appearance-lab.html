<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CharPet · 身体工作室</title><style>*{box-sizing:border-box}body{margin:0;background:#f7f4ef;color:#2d2926;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.wrap{max-width:1100px;margin:auto;padding:28px 18px 50px}.head{display:flex;justify-content:space-between;gap:16px;align-items:flex-start;margin-bottom:18px}.eyebrow{font-size:11px;letter-spacing:.14em;color:#9a9188;font-weight:800}.head h1{margin:7px 0;font-size:32px}.head p{margin:0;color:#7f7770}.badge{background:#fff;border:1px solid #e4ddd5;border-radius:999px;padding:9px 12px;font-size:12px}.tabs{display:flex;gap:8px;overflow:auto;padding:5px 0 15px}.tabs button,.choice,.save{border:1px solid #dfd7cf;background:#fffaf5;border-radius:15px;padding:11px 14px;cursor:pointer;color:inherit}.tabs button.active{background:#24211f;color:#fff}.work{display:grid;grid-template-columns:minmax(300px,.9fr) minmax(0,1.4fr);gap:16px}.preview,.editor{background:#fffdf9;border:1px solid #e4ddd5;border-radius:26px;padding:18px}.preview{min-height:610px;display:flex;flex-direction:column}.stage{flex:1;min-height:460px;border-radius:22px;background:linear-gradient(135deg,#eee6df,#e8dfd6);position:relative;overflow:hidden;display:grid;place-items:center}.pet{font-size:118px;filter:drop-shadow(0 14px 10px rgba(60,45,35,.14));transition:.3s}.stage.screen .pet{position:absolute;right:8px;bottom:42px;animation:edgecrawl 3.2s ease-in-out infinite}.stage.peek .pet{position:absolute;right:-22px;top:28px;transform:rotate(-12deg);font-size:100px}.stage.hang .pet{position:absolute;right:0;top:45%;transform:rotate(8deg)}@keyframes edgecrawl{0%,100%{right:8px;bottom:42px;transform:rotate(0)}25%{right:35%;bottom:8px;transform:rotate(-8deg)}50%{right:8px;bottom:8px;transform:rotate(0)}75%{right:8px;bottom:48%;transform:rotate(-5deg)}}.screenline{position:absolute;inset:12px;border:2px dashed rgba(120,95,80,.2);border-radius:18px}.screennote{position:absolute;left:14px;top:14px;background:#fffaf4dd;border:1px solid #eadbd0;border-radius:14px;padding:9px 11px;font-size:12px}.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}.chip{background:#f3ede7;border-radius:999px;padding:7px 9px;font-size:11px;color:#746c65}.current{padding-top:14px;display:grid;gap:4px;font-size:13px}.current b{font-size:12px;color:#8c837a}.section{margin-bottom:18px}.section h2{font-size:16px;margin:0 0 10px}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px}.choice{min-height:88px;text-align:left;display:flex;flex-direction:column;gap:4px}.choice b{font-size:25px}.choice small{font-size:11px;color:#91877e}.choice.selected{border-color:#24211f;box-shadow:0 0 0 2px #24211f18;background:#f5eee8}.upload{border:1px dashed #cfc4ba;border-radius:15px;min-height:88px;display:grid;place-items:center;color:#8a8179;font-size:12px;cursor:pointer}.form{display:grid;gap:10px}.form label{font-size:12px;font-weight:800;display:grid;gap:6px}.form input,.form textarea{border:1px solid #ded6ce;background:#fff;border-radius:12px;padding:10px 12px;font:inherit}.form textarea{min-height:78px;resize:vertical}.hint{padding:12px;border-radius:14px;background:#f5eee8;color:#766e67;font-size:12px;line-height:1.6}.colorrow{display:flex;gap:9px;flex-wrap:wrap}.color{width:42px;height:42px;border-radius:13px;border:2px solid #fff;box-shadow:0 0 0 1px #d9d0c7;cursor:pointer}.footer{display:flex;justify-content:space-between;gap:10px;align-items:center;border-top:1px solid #eee7df;padding-top:14px}.save{background:#24211f;color:#fff;border-color:#24211f}.hidden{display:none}@media(max-width:760px){.work{grid-template-columns:1fr}.preview{min-height:520px}.stage{min-height:380px}.grid{grid-template-columns:repeat(2,1fr)}} </style></head><body><main class="wrap"><header class="head"><div><span class="eyebrow">CHARPET · BODY & IDENTITY</span><h1>Char 身体工作室</h1><p>把 Char 的身份、姿势、表情、服装、部件和动画拆开搓，再组合成最终形态。</p></div><span class="badge">● 前端原型 · 可交互</span></header><nav class="tabs" id="tabs"></nav><section class="work"><aside class="preview"><div class="stage" id="stage"><div class="screenline"></div><div class="screennote">📱 <b>贴屏爬</b><br>沿手机边缘爬来爬去</div><div class="pet" id="pet">🐾</div></div><div class="chips" id="chips"></div><div class="current"><b>当前组合</b><span id="summary"></span></div></aside><section class="editor" id="editor"></section></section></main><script>const data={pose:[['stand','🧍','站立'],['sit','🪑','坐着'],['lie','🛏️','躺着'],['crouch','🫣','蹲着'],['walk','🚶','走路'],['crawl','🐾','普通爬行'],['screen','📱','贴屏爬'],['peek','👀','角落探头'],['hang','🫳','挂在边缘'],['picked','🫴','被抓起']],expression:[['idle','😐','平静'],['happy','🥰','开心'],['sad','🥺','委屈'],['angry','😾','生气'],['surprised','😳','惊讶'],['shy','🫣','害羞'],['sleep','😴','困困'],['excited','✨','兴奋']],outfit:[['default','✨','原装'],['casual','👕','日常便服'],['school','🎒','学院风'],['pajama','🌙','睡衣'],['goth','🖤','暗黑系'],['fantasy','🪽','幻想服']],parts:[['ears','🐱','耳朵'],['tail','🦊','尾巴'],['ribbon','🎀','装饰物'],['custom','➕','自定义部件']],motion:[['breathe','〰️','呼吸'],['blink','👁️','眨眼'],['drag','🫳','被拖动'],['sleep','💤','睡觉'],['screen','📱','贴屏爬行'],['picked','🫴','被抓起']],template:[['soft','🍬','软萌贴纸'],['diary','📔','少女手帐'],['dark','🖤','阴暗系'],['retro','🪪','复古证件'],['cyber','💿','Y2K / 赛博']]};let state={tab:'pose',pose:'screen',expression:'happy',outfit:'default',parts:new Set(['ears','tail']),motion:'screen',template:'soft',colors:['#f3a88d','#fff4ec','#5d4b44']};const labels={pose:'🧍 姿势',expression:'😊 表情',outfit:'👕 服装',parts:'🐾 部件',motion:'✨ 动画',identity:'🪪 身份卡'};function label(type,id){return (data[type]||[]).find(x=>x[0]===id)?.[2]||id}function renderTabs(){tabs.innerHTML=Object.keys(labels).map(k=>`<button class="${state.tab===k?'active':''}" onclick="state.tab='${k}';render()">${labels[k]}</button>`).join('')}function choices(type){return `<div class="grid">${data[type].map(x=>`<button class="choice ${(type==='parts'?state.parts.has(x[0]):state[type]===x[0])?'selected':''}" onclick="pick('${type}','${x[0]}')"><b>${x[1]}</b><span>${x[2]}</span><small>${x[0]==='screen'?'沿手机边缘爬来爬去':type==='outfit'?'独立服装层':type==='parts'&&(x[0]==='ears'||x[0]==='tail')?'可以摸摸它':''}</small></button>`).join('')} ${type==='outfit'?'<label class="upload">＋ 上传新服装<input class="hidden" type="file" accept="image/*"></label>':''}</div>`}function render(){renderTabs();let e=editor;if(state.tab==='identity')e.innerHTML=`<div class="section"><h2>身份卡信息</h2><div class="form"><label>名字<input value="我的 Char"></label><label>昵称<input value="小家伙"></label><label>Tag<input value="文艺青年, 夜猫子"></label><label>个性签名<textarea>今天也要贴着屏幕陪你。</textarea></label><div class="hint">User 可以改，Char 也可以通过 MCP 改。这里不放“公开资料”。</div></div></div><div class="section"><h2>身份卡模板</h2>${choices('template')}</div><div class="section"><h2>配色（模板布局固定，颜色可自定义）</h2><div class="colorrow">${state.colors.map(c=>`<input class="color" type="color" value="${c}" onchange="state.colors=[...document.querySelectorAll('.color')].map(x=>x.value);render()">`).join('')}</div></div>`;else e.innerHTML=`<div class="section"><h2>${labels[state.tab]}</h2>${choices(state.tab)}</div>`;document.getElementById('stage').className='stage '+(state.pose==='screen'?'screen':state.pose==='peek'?'peek':state.pose==='hang'?'hang':'');document.getElementById('summary').textContent=`${label('pose',state.pose)} · ${label('expression',state.expression)} · ${label('outfit',state.outfit)}`;document.getElementById('chips').innerHTML=[label('pose',state.pose),label('expression',state.expression),label('outfit',state.outfit),...Array.from(state.parts).map(x=>label('parts',x))].map(x=>`<span class="chip">${x}</span>`).join('')}function pick(type,id){if(type==='parts'){state.parts.has(id)?state.parts.delete(id):state.parts.add(id)}else state[type]=id;render()}render()</script></body></html>
