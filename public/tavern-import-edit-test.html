<!doctype html><html lang="zh-CN"><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CharPet · 角色卡编辑测试</title><style>body{margin:0;background:#f7f4ef;color:#302b28;font:14px system-ui,-apple-system,sans-serif}.wrap{max-width:900px;margin:auto;padding:28px 18px 60px}h1{margin:8px 0}.drop,.panel{background:#fffdf9;border:1px solid #e3dbd3;border-radius:20px;padding:22px}.drop{margin:18px 0;text-align:center;border:2px dashed #cfc3b9;cursor:pointer}.hidden{display:none}.error,.ok{margin:12px 0;padding:12px;border-radius:12px}.error{background:#fff0ed;color:#9a4035}.ok{background:#edf7ef;color:#3f7547}.profile{white-space:pre-wrap;line-height:1.7;background:#f5f0eb;padding:14px;border-radius:14px}.head{display:flex;justify-content:space-between;align-items:center;gap:12px}.toggle{appearance:none;width:44px;height:25px;border-radius:20px;background:#cfc7bf;position:relative;cursor:pointer}.toggle:before{content:'';position:absolute;width:19px;height:19px;left:3px;top:3px;border-radius:50%;background:#fff;transition:.2s}.toggle:checked{background:#756960}.toggle:checked:before{transform:translateX(19px)}.wb{margin-top:22px;padding-top:18px;border-top:1px solid #e8e0d8}.item{margin-top:10px;border:1px solid #e1d9d1;border-radius:15px;padding:13px;background:#fff}.view{display:block}.edit{display:none}.editing .view{display:none}.editing .edit{display:block}input,textarea{width:100%;box-sizing:border-box;border:1px solid #d9d0c8;background:#fcfaf7;border-radius:10px;padding:9px;font:inherit;margin-bottom:8px}textarea{min-height:100px;resize:vertical}.buttons{display:flex;justify-content:flex-end;gap:7px}.btn{border:1px solid #d9d0c8;background:#fff;border-radius:10px;padding:7px 11px;cursor:pointer}.primary{background:#756960;color:#fff}.danger{color:#9a4035}.muted{color:#8a817a;font-size:12px}@media(max-width:650px){.head{align-items:flex-start}}</style><main class="wrap"><h1>🪪 酒馆角色卡编辑测试</h1><p>只提取和角色本身关联较大的世界书内容；现在可以编辑、增加、删除。</p><label class="drop" id="drop"><b>拖入酒馆 PNG 角色卡</b><br><small>支持 chara / ccv3 · 本地解析，不上传</small><input id="file" class="hidden" type="file" accept="image/png,.png"></label><div id="msg"></div><section id="out"></section></main><script>const S=[137,80,78,71,13,10,26,10],$=x=>document.getElementById(x);let periods=[];const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function b64(v){const s=atob(v.replace(/\s/g,'')),b=new Uint8Array(s.length);for(let i=0;i<s.length;i++)b[i]=s.charCodeAt(i);return b}function parse(buf){let b=new Uint8Array(buf);if(b.length>2e7)throw Error('角色卡超过20MB');if(!S.every((x,i)=>b[i]===x))throw Error('不是PNG角色卡');let o=8,v=null;while(o+12<=b.length){let n=new DataView(b.buffer,b.byteOffset+o,4).getUint32(0),t=new TextDecoder('latin1').decode(b.subarray(o+4,o+8)),d=b.subarray(o+8,o+8+n);if(t==='tEXt'){let z=d.indexOf(0);if(z>=0){let k=new TextDecoder('latin1').decode(d.subarray(0,z));if(k==='ccv3'||k==='chara'){try{let q=JSON.parse(new TextDecoder().decode(b64(new TextDecoder('latin1').decode(d.subarray(z+1)))));if(k==='ccv3'||q.data)v=q}catch{}}}}o+=12+n;if(t==='IEND')break}if(!v)throw Error('没有找到 chara / ccv3 数据');let c=v.data&&typeof v.data==='object'?v.data:v;return{name:c.name||'',description:c.description||'',personality:c.personality||'',scenario:c.scenario||'',first_mes:c.first_mes||'',mes_example:c.mes_example||'',tags:Array.isArray(c.tags)?c.tags:[],book:c.character_book||null}}function relevant(e){let s=JSON.stringify(e||{});return /(童年|少年|青年|成年|晚年|幼年|小时候|长大后|过去|现在|未来|初期|后期|早期|中期|时期|阶段|白天|夜晚|晚上|深夜|清晨|早晨|day|night|morning|childhood|teen|adult|future|past|phase|period)/i.test(s)&&/(性格|人格|脾气|态度|行为|举止|习惯|情绪|心理|内心|性情|特点|特征|personality|temper|behavior|mood|trait|attitude|habit|emotion)/i.test(s)}function title(e,i){return e.comment||e.name||e.key||'时间段性格 '+(i+1)}function body(e){for(let k of ['content','entry','text','description','comment','memo','value'])if(typeof e?.[k]==='string'&&e[k].trim())return e[k];return ''}function render(){let b=$('items');if(!periods.length){b.innerHTML='<div class="muted">没有自动识别到时间段性格。你可以手动增加。</div>';return}b.innerHTML=periods.map((p,i)=>`<article class="item" data-i="${i}"><div class="view"><div class="head"><b>${esc(p.title)}</b><span><button class="btn editBtn">编辑</button> <button class="btn danger del">删除</button></span></div><div style="margin-top:7px;white-space:pre-wrap;line-height:1.6">${esc(p.text||'（空）')}</div></div><div class="edit"><input class="ti" value="${esc(p.title)}" placeholder="时间段名称"><textarea class="tx" placeholder="这个时间段的性格变化">${esc(p.text)}</textarea><div class="buttons"><button class="btn cancel">取消</button><button class="btn primary save">保存</button></div></div></article>`).join('');b.querySelectorAll('.editBtn').forEach(x=>x.onclick=()=>x.closest('.item').classList.add('editing'));b.querySelectorAll('.cancel').forEach(x=>x.onclick=()=>x.closest('.item').classList.remove('editing'));b.querySelectorAll('.save').forEach(x=>x.onclick=()=>{let a=x.closest('.item'),i=+a.dataset.i;periods[i]={title:a.querySelector('.ti').value.trim()||'时间段性格',text:a.querySelector('.tx').value.trim()};render();flash('已保存')});b.querySelectorAll('.del').forEach(x=>x.onclick=()=>{let i=+x.closest('.item').dataset.i;if(confirm('确定删除这条时间段性格吗？')){periods.splice(i,1);render();flash('已删除')}})}function add(){periods.push({title:'新的时间段',text:''});render();let a=$('items').lastElementChild;a.classList.add('editing');a.scrollIntoView({behavior:'smooth',block:'center'})}function flash(s){$('msg').innerHTML='<div class="ok">✓ '+esc(s)+'</div>'}function show(file,c){let r=new FileReader();r.onload=()=>{$('out').innerHTML='<div class="panel"><h2>'+esc(c.name||file.name)+'</h2><div class="profile">'+esc([c.description&&'【角色描述】\n'+c.description,c.personality&&'【性格】\n'+c.personality,c.scenario&&'【场景】\n'+c.scenario,c.first_mes&&'【开场白】\n'+c.first_mes,c.mes_example&&'【示例对话】\n'+c.mes_example].filter(Boolean).join('\n\n')||'（空）')+'</div><div class="wb"><div class="head"><b>角色关联信息</b><label>显示时间段性格 <input id="toggle" class="toggle" type="checkbox" checked></label></div><p class="muted">不显示状态栏、优先级、概率、关键词等结构字段。</p><div id="items"></div><div class="buttons" style="margin-top:10px"><button id="add" class="btn primary">＋ 增加时间段性格</button></div><p class="muted">当前测试页的修改只作用于本次导入；正式接入角色档案后会写回该角色。</p></div></div>';render();$('toggle').onchange=e=>$('items').style.display=e.target.checked?'':'none';$('add').onclick=add};r.readAsDataURL(file)}async function handle(f){$('msg').innerHTML='';$('out').innerHTML='';try{let c=parse(await f.arrayBuffer());periods=Array.isArray(c.book?.entries)?c.book.entries.filter(relevant).map((e,i)=>({title:title(e,i),text:body(e)})):[];show(f,c);flash('解析成功：'+(c.name||f.name))}catch(e){$('msg').innerHTML='<div class="error">解析失败：'+esc(e.message||e)+'</div>'}}$('file').onchange=e=>handle(e.target.files?.[0]);$('drop').ondragover=e=>{e.preventDefault()};$('drop').ondrop=e=>{e.preventDefault();handle(e.dataTransfer.files?.[0])};</script></main>
