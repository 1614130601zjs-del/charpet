<!doctype html><html lang="zh-CN"><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CharPet · 酒馆角色卡读取测试</title><style>body{margin:0;background:#f7f4ef;color:#302b28;font:14px system-ui,-apple-system,sans-serif}.wrap{max-width:900px;margin:auto;padding:28px 18px 60px}h1{margin:8px 0}.drop,.panel{background:#fffdf9;border:1px solid #e3dbd3;border-radius:20px;padding:22px}.drop{margin:18px 0;text-align:center;border:2px dashed #cfc3b9;cursor:pointer}.hidden{display:none}.error,.ok{margin:12px 0;padding:12px;border-radius:12px}.error{background:#fff0ed;color:#9a4035}.ok{background:#edf7ef;color:#3f7547}.profile{white-space:pre-wrap;line-height:1.7;background:#f5f0eb;padding:14px;border-radius:14px}.head{display:flex;justify-content:space-between;align-items:center;gap:12px}.toggle{appearance:none;width:44px;height:25px;border-radius:20px;background:#cfc7bf;position:relative;cursor:pointer}.toggle:before{content:'';position:absolute;width:19px;height:19px;left:3px;top:3px;border-radius:50%;background:#fff;transition:.2s}.toggle:checked{background:#756960}.toggle:checked:before{transform:translateX(19px)}.wb{margin-top:22px;padding-top:18px;border-top:1px solid #e8e0d8}.item{margin-top:10px;border:1px solid #e1d9d1;border-radius:15px;padding:13px;background:#fff}.muted{color:#8a817a;font-size:12px}.buttons{display:flex;justify-content:flex-end;gap:7px}.btn{border:1px solid #d9d0c8;background:#fff;border-radius:10px;padding:7px 11px;cursor:pointer}.primary{background:#756960;color:#fff}.danger{color:#9a4035}input,textarea{width:100%;box-sizing:border-box;border:1px solid #d9d0c8;background:#fcfaf7;border-radius:10px;padding:9px;font:inherit;margin-bottom:8px}textarea{min-height:100px;resize:vertical}.view{display:block}.edit{display:none}.editing .view{display:none}.editing .edit{display:block}</style><main class="wrap"><h1>🪪 酒馆角色卡读取测试</h1><p>读取 PNG 内的 chara / ccv3 数据；时间线只根据世界书条目标题识别，不读取正文判断时间线。</p><label class="drop" id="drop"><b>拖入酒馆 PNG 角色卡</b><br><small>支持 chara / ccv3 · 本地解析，不上传</small><input id="file" class="hidden" type="file" accept="image/png,.png"></label><div id="msg"></div><section id="out"></section></main><script>const S=[137,80,78,71,13,10,26,10],$=x=>document.getElementById(x);let periods=[];const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function b64(v){const s=atob(v.replace(/\s/g,'')),b=new Uint8Array(s.length);for(let i=0;i<s.length;i++)b[i]=s.charCodeAt(i);return b}function jsonText(v){const t=v.trim(),a=[t];try{a.push(new TextDecoder().decode(b64(t)))}catch{}for(const x of a){try{const q=JSON.parse(x);if(q&&typeof q==='object')return q}catch{}}return null}function textChunk(type,d){if(type==='tEXt'){const z=d.indexOf(0);return z<0?null:{key:new TextDecoder('latin1').decode(d.slice(0,z)),value:new TextDecoder('latin1').decode(d.slice(z+1))}}if(type==='iTXt'){let p=d.indexOf(0);if(p<0)return null;const key=new TextDecoder().decode(d.slice(0,p));const cf=d[p+1],cm=d[p+2];p+=3;if(cf!==0||cm!==0)return null;const l=d.indexOf(0,p);if(l<0)return null;p=l+1;const tr=d.indexOf(0,p);if(tr<0)return null;p=tr+1;return{key,value:new TextDecoder().decode(d.slice(p))}}return null}function parse(buf){const b=new Uint8Array(buf);if(b.length>2e7)throw Error('角色卡超过20MB');if(!S.every((x,i)=>b[i]===x))throw Error('不是PNG角色卡');let o=8,v3=null,v2=null,v1=null;while(o+12<=b.length){const n=new DataView(b.buffer,b.byteOffset+o,4).getUint32(0),t=new TextDecoder('latin1').decode(b.slice(o+4,o+8)),d=b.slice(o+8,o+8+n);if(o+12+n>b.length)break;const x=textChunk(t,d);if(x&&(x.key==='ccv3'||x.key==='chara')){const q=jsonText(x.value);if(q){if(x.key==='ccv3')v3=q;else if(q.data&&typeof q.data==='object')v2=q;else v1=q}}o+=12+n;if(t==='IEND')break}if(!v3&&!v2&&!v1)throw Error('没有找到酒馆角色卡数据（ccv3/chara）');const q=v3||v2||v1,c=q.data&&typeof q.data==='object'?q.data:q;return{name:c.name||'',description:c.description||'',personality:c.personality||'',scenario:c.scenario||'',first_mes:c.first_mes||'',mes_example:c.mes_example||'',tags:Array.isArray(c.tags)?c.tags:[],book:c.character_book||null}}function title(e,i){return e.comment||e.name||e.key||'世界书条目 '+(i+1)}function body(e){for(const k of ['content','entry','text','description','comment','memo','value'])if(typeof e?.[k]==='string'&&e[k].trim())return e[k];return ''}function timelineTitle(s){const t=String(s||'').trim();return /(线|期|后|前|年|岁|童年|少年|青年|成年|晚年|幼年|过去|现在|未来|初期|中期|后期|阶段|时期|day|night|morning|childhood|teen|adult|future|past|phase|period)/i.test(t)}function render(){const b=$('items');if(!periods.length){b.innerHTML='<div class="muted">没有自动识别到时间线条目。可以手动增加。</div>';return}b.innerHTML=periods.map((p,i)=>`<article class="item" data-i="${i}"><div class="view"><div class="head"><b>${esc(p.title)}</b><span><button class="btn editBtn">编辑</button> <button class="btn danger del">删除</button></span></div><div style="margin-top:7px;white-space:pre-wrap;line-height:1.6">${esc(p.text||'（空）')}</div></div><div class="edit"><input class="ti" value="${esc(p.title)}" placeholder="时间线名称"><textarea class="tx" placeholder="时间线关联内容">${esc(p.text)}</textarea><div class="buttons"><button class="btn cancel">取消</button><button class="btn primary save">保存</button></div></div></article>`).join('');b.querySelectorAll('.editBtn').forEach(x=>x.onclick=()=>x.closest('.item').classList.add('editing'));b.querySelectorAll('.cancel').forEach(x=>x.onclick=()=>x.closest('.item').classList.remove('editing'));b.querySelectorAll('.save').forEach(x=>x.onclick=()=>{const a=x.closest('.item'),i=+a.dataset.i;periods[i]={title:a.querySelector('.ti').value.trim()||'时间线条目',text:a.querySelector('.tx').value.trim()};render();flash('已保存')});b.querySelectorAll('.del').forEach(x=>x.onclick=()=>{const i=+x.closest('.item').dataset.i;if(confirm('确定删除吗？')){periods.splice(i,1);render();flash('已删除')}})}function add(){periods.push({title:'新的时间线',text:''});render();const a=$('items').lastElementChild;a.classList.add('editing');a.scrollIntoView({behavior:'smooth',block:'center'})}function flash(s){$('msg').innerHTML='<div class="ok">✓ '+esc(s)+'</div>'}function show(file,c){$('out').innerHTML='<div class="panel"><h2>'+esc(c.name||file.name)+'</h2><div class="profile">'+esc([c.description&&'【角色描述】\n'+c.description,c.personality&&'【性格】\n'+c.personality,c.scenario&&'【场景】\n'+c.scenario,c.first_mes&&'【开场白】\n'+c.first_mes,c.mes_example&&'【示例对话】\n'+c.mes_example].filter(Boolean).join('\n\n')||'（空）')+'</div><div class="wb"><div class="head"><b>时间线世界书</b><label>启用标题识别 <input id="toggle" class="toggle" type="checkbox" checked></label></div><p class="muted">只看世界书条目标题，不用正文关键词决定它是不是时间线；支持“男高线、男大线、真骨线、人妻线、婚后、五年后”等命名。</p><div id="items"></div><div class="buttons" style="margin-top:10px"><button id="add" class="btn primary">＋ 增加时间线</button></div></div></div>';periods=Array.isArray(c.book?.entries)?c.book.entries.map((e,i)=>({e,i})).filter(x=>timelineTitle(title(x.e,x.i))).map(x=>({title:title(x.e,x.i),text:body(x.e)})):[];render();$('toggle').onchange=e=>$('items').style.display=e.target.checked?'':'none';$('add').onclick=add}async function handle(f){$('msg').innerHTML='';$('out').innerHTML='';if(!f)return;try{const c=parse(await f.arrayBuffer());show(f,c);flash('解析成功：'+(c.name||f.name)+' · '+(c.book?.entries?.length||0)+' 条世界书')}catch(e){$('msg').innerHTML='<div class="error">解析失败：'+esc(e.message||e)+'</div>'}}$('file').onchange=e=>handle(e.target.files?.[0]);$('drop').ondragover=e=>e.preventDefault();$('drop').ondrop=e=>{e.preventDefault();handle(e.dataTransfer.files?.[0])};</script></main>
